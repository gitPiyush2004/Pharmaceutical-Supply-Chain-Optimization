# =============================================================================
# Pharmaceutical Supply Chain Optimization - Central Configuration
# -----------------------------------------------------------------------------
# Every tunable constant in the platform lives here. No magic numbers in code.
# Modules read this via `src.config.get_config()`.
# =============================================================================

project:
  name: "Pharmaceutical Supply Chain Optimization"
  short_name: "PharmaChain Analytics"
  version: "1.0.0"
  author: "Piyush Bhatia"
  random_seed: 42

# -----------------------------------------------------------------------------
# Filesystem layout (all paths are relative to the repository root)
# -----------------------------------------------------------------------------
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_external: "data/external"
  models: "models"
  reports: "reports"
  figures: "reports/figures"
  logs: "logs"

# Two datasets, both real and both publicly available. drug200 ships with the
# repository; SCMS is downloaded once and cached, so a fresh clone builds with one
# command and later runs need no network.
datasets:
  drug200: "data/raw/drug200.csv"
  scms: "data/external/SCMS_Delivery_History_Dataset.csv"

# -----------------------------------------------------------------------------
# Data quality scoring - weights must sum to 1.0
# -----------------------------------------------------------------------------
data_quality:
  weights:
    completeness: 0.30
    uniqueness: 0.20
    validity: 0.25
    consistency: 0.15
    accuracy: 0.10
  outlier_method: "iqr"      # iqr | zscore
  iqr_multiplier: 1.5
  zscore_threshold: 3.0
  grade_bands:                # lower bound -> letter grade
    A: 90
    B: 80
    C: 70
    D: 60

# -----------------------------------------------------------------------------
# Machine learning
# -----------------------------------------------------------------------------
ml:
  drug_classification:
    target: "Drug"
    numeric_features: ["Age", "Na_to_K"]
    categorical_features: ["Sex", "BP", "Cholesterol"]
    test_size: 0.25
    cv_folds: 5
    scoring: "f1_macro"
    models: ["decision_tree", "random_forest", "xgboost"]
    param_grid:
      decision_tree:
        max_depth: [3, 4, 5, 6, 8, null]
        min_samples_split: [2, 4, 6]
        criterion: ["gini", "entropy"]
      random_forest:
        n_estimators: [200, 400]
        max_depth: [4, 6, 8, null]
        min_samples_leaf: [1, 2]
      xgboost:
        n_estimators: [200, 400]
        max_depth: [3, 4, 6]
        learning_rate: [0.05, 0.1, 0.2]
        subsample: [0.8, 1.0]
  # Domain thresholds used by src/ml/preprocess.py feature engineering.
  # Kept here (not in code) so the clinical cut-offs stay auditable.
  feature_engineering:
    clinical:
      # Age strata used in cardiovascular prescribing guidance.
      age_bins: [30, 45, 60]
      age_labels: ["<30", "30-45", "45-60", "60+"]
      # Serum sodium/potassium ratio bands. >15 is the dominant driver of the
      # DrugY decision in the reference dataset.
      na_to_k_low: 10.0
      na_to_k_high: 15.0
      # Ordinal severity encoding for BP / Cholesterol levels.
      ordinal_levels: {HIGH: 2, NORMAL: 1, LOW: 0}

# -----------------------------------------------------------------------------
# SCMS - the real USAID delivery history dataset
# -----------------------------------------------------------------------------
scms:
  # Minimum shipments before a vendor, country or lane is scored. Below this the
  # rate is too noisy to act on: a vendor with 3 shipments and 1 late delivery
  # would otherwise appear worse than one with 500 shipments at 90% on-time.
  min_shipments_for_scoring: 30
  on_time_target_pct: 90.0
  # On-time percentage floors for vendor tiering. A vendor below the Approved
  # floor lands on the watchlist. These are procurement policy rather than
  # statistics, which is exactly why they belong in configuration.
  vendor_tiers: {Preferred: 92, Approved: 85, Watchlist: 0}
  # Freight as a share of commodity value is extremely right-skewed on real data
  # (tiny line values produce four-digit percentages), so summaries use the
  # median and charts clip the display range.
  freight_pct_display_cap: 100.0
  # The real procurement funnel, in milestone order.
  funnel_stages:
    - Price Quote Sent
    - PO Sent to Vendor
    - Scheduled for Delivery
    - Delivered to Client
    - Delivery Recorded
  # Product catalogue and pricing analysis (src/analytics/products.py). SCMS is a
  # product catalogue as well as a delivery log - 184 items, 86 molecules, 88
  # factories - so the same file answers "what did we buy, and did we overpay?"
  products:
    # A product needs this many line items before its price range is reported. A
    # product bought three times has a "range" that is really just three numbers.
    min_shipments_for_spread: 20
    # And it needs at least this many factories, because a price spread is only
    # actionable if it maps onto suppliers a buyer could choose between.
    min_sites_for_spread: 3
    # Rows in the ranked top-products table.
    top_n_products: 15
  late_delivery_model:
    target: "is_late"
    test_size: 0.25
    cv_folds: 5
    # Macro F1 rather than ROC AUC: it is the metric the other two models are
    # selected on, so all three stay directly comparable, and it handles the
    # 88.5/11.5 class imbalance by weighting both classes equally. ROC AUC is
    # still computed and reported in the evaluation block.
    scoring: "f1_macro"
    numeric_features:
      - quantity
      - line_value_usd
      - unit_price_usd
      - units_per_pack
      - weight_kg
      - freight_cost_usd
      - scheduled_lead_time_days
    categorical_features:
      - shipment_mode
      - product_group
      - sub_classification
      - region
      - fulfil_via
      - inco_term
      - managed_by
      - first_line_designation

# -----------------------------------------------------------------------------
# Statistical testing
# -----------------------------------------------------------------------------
# There are no hard-coded experiment rates here any more. Every comparison the
# platform reports is measured from the real data at run time by
# src/analytics/experiments.py, so any number on a page traces back to rows in a
# file. What remains are the decision rules the tests are run under.
ab_testing:
  alpha: 0.05                 # two-sided significance level
  power: 0.80                 # target power for sample-size planning
  default_sample_size: 2000   # starting point for the power calculator only
  # Below this many rows in either arm a comparison is not reported at all - the
  # rate would be too noisy to act on.
  min_group_size: 30
  # Absolute skewness above which a mean-based test (Welch) is replaced by a
  # rank-based one (Mann-Whitney). Freight cost as a share of value has a mean of
  # 2,548% against a median of 10.6%, and on that column Welch returns p=0.254
  # where Mann-Whitney returns p=1.6e-93. The threshold exists so the choice of
  # test is a stated rule rather than a judgement made per chart.
  skew_limit: 2.0

# -----------------------------------------------------------------------------
# Business assumptions used to convert an analytical result into money
# -----------------------------------------------------------------------------
economics:
  # SLA credit payable per late shipment. This is the one genuinely assumed number
  # left in the project: SCMS records no penalty column, so any dollar impact of a
  # late-delivery improvement is this rate multiplied by a measured shipment count.
  # It is isolated here so it is obvious which figures rest on an assumption and
  # which are measured.
  late_shipment_penalty: 1850
  currency: "USD"

# -----------------------------------------------------------------------------
# Visualisation theme
# -----------------------------------------------------------------------------
viz:
  template: "plotly_white"
  palette:
    primary: "#0B6E99"
    secondary: "#16A0A0"
    accent: "#E8833A"
    success: "#2E9E5B"
    warning: "#E0A32E"
    danger: "#C7443B"
    neutral: "#6B7280"
  sequence: ["#0B6E99", "#16A0A0", "#E8833A", "#2E9E5B", "#7C5BB8", "#C7443B", "#E0A32E", "#6B7280"]
  # Sequential blue-to-green ramp for the value and lateness funnels.
  funnel_scale: ["#083D57", "#0B6E99", "#1490B5", "#16A0A0", "#3FB98B", "#7DCB72"]

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)-28s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  file: "logs/pharmachain.log"
